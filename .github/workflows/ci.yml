name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      nativeCad:
        description: Build and test the native CAD worker on every desktop platform
        type: boolean
        default: true
      nativeCadMatrix:
        description: JSON array of native CAD platforms to test (leave unchanged for all)
        type: string
        default: '[{"os":"windows-2022","target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"}]'
      windowsSdkProbe:
        description: Check the Windows Rust linker before building OCCT
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/version.mjs
      - run: npm run check:docs
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/desktop/test-results
  native:
    # macOS /var temp aliases are symlinks; security tests require a real root.
    env:
      TMPDIR: ${{ runner.temp }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-migrations.mjs
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
  native-cad:
    if: github.event_name == 'workflow_dispatch' && inputs.nativeCad
    env:
      TMPDIR: ${{ runner.temp }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.nativeCadMatrix || '[{"os":"windows-2022","target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/cache@v4
        with:
          path: |
            .local/occt-build
            .local/occt-install-unix-${{ matrix.target }}
          key: occt-V8_0_1-${{ matrix.target }}-${{ runner.os == 'macOS' && 'v2' || 'v1' }}
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Native CAD smoke on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          FORMA_NATIVE_TEST_ONLY: '1'
        run: bash scripts/build-native-unix.sh '${{ matrix.target }}' 'app'
      - name: Prepare Windows OpenCascade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\check-windows-toolchain.ps1
          .\scripts\build-occt-windows.ps1
      - name: Native CAD smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .\scripts\windows-env.ps1
          $env:FORMA_OCCT_ROOT = (Resolve-Path '.local\occt-build').Path
          $env:PATH = "$(Join-Path $env:FORMA_OCCT_ROOT 'win64/vc14/bin');$env:PATH"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --target '${{ matrix.target }}' --features native-occt --lib --test native_worker
  windows-sdk-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.windowsSdkProbe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - shell: pwsh
        run: .\scripts\check-windows-toolchain.ps1
  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-cad.txt
      - run: python scripts/test_cad.py
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: rustsec/audit-check@v2
        with:
          working-directory: apps/desktop/src-tauri
          token: ${{ secrets.GITHUB_TOKEN }}
          # SQLx's unused MySQL feature retains rsa in Cargo.lock; Forma uses SQLite only.
          ignore: RUSTSEC-2023-0071
