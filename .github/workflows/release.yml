name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/version.mjs
  quality:
    needs: validate
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundles: appimage,deb,rpm
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/cache@v4
        with:
          path: |
            .local/occt-build
            .local/occt-install-unix-${{ matrix.target }}
          key: occt-V8_0_1-${{ matrix.target }}-${{ runner.os == 'macOS' && 'v2' || 'v1' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
      - run: node scripts/version.mjs
      - name: Configure signed updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('Add TAURI_SIGNING_PRIVATE_KEY in GitHub Actions secrets')"
          node scripts/configure-release.mjs
      - name: Prepare Windows OpenCascade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\check-windows-toolchain.ps1
          .\scripts\build-occt-windows.ps1
      - name: Build signed Windows installer with native CAD
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .\scripts\build-native-windows.ps1 -OcctRoot '.local\occt-build' -TargetTriple '${{ matrix.target }}'
      - name: Build signed Linux installers with native CAD
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-native-unix.sh '${{ matrix.target }}' '${{ matrix.bundles }}'
      - name: Build signed macOS installers with native CAD
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FORMA_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          FORMA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          FORMA_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          FORMA_APPLE_ID: ${{ secrets.APPLE_ID }}
          FORMA_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FORMA_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$FORMA_APPLE_CERTIFICATE" ]]; then
            if [[ -z "$FORMA_APPLE_CERTIFICATE_PASSWORD" ]]; then
              echo 'APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set.' >&2
              exit 1
            fi
            export APPLE_CERTIFICATE="$FORMA_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$FORMA_APPLE_CERTIFICATE_PASSWORD"
            if [[ -n "$FORMA_APPLE_SIGNING_IDENTITY" ]]; then
              export APPLE_SIGNING_IDENTITY="$FORMA_APPLE_SIGNING_IDENTITY"
            fi
            if [[ -n "$FORMA_APPLE_ID" && -n "$FORMA_APPLE_PASSWORD" && -n "$FORMA_APPLE_TEAM_ID" ]]; then
              export APPLE_ID="$FORMA_APPLE_ID"
              export APPLE_PASSWORD="$FORMA_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$FORMA_APPLE_TEAM_ID"
            fi
          else
            export APPLE_SIGNING_IDENTITY='-'
          fi
          bash scripts/build-native-unix.sh '${{ matrix.target }}' '${{ matrix.bundles }}'
      - run: node scripts/release-artifacts.mjs collect ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: .release-artifacts/${{ matrix.platform }}/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .release-artifacts
          merge-multiple: true
      - name: Merge updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Beta tags (vX.Y.Z-beta.N) go only to the private beta repository, never to the public latest.json.
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then export RELEASE_REPOSITORY=lovlyDev/FormaCAD-beta; fi
          node scripts/release-artifacts.mjs merge
      # Signed build provenance (Sigstore) for every public release file; verify with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !contains(github.ref_name, '-beta.') }}
        with:
          subject-path: .release-artifacts/*
      - name: Publish beta to the private repository
        if: contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then echo 'Add BETA_RELEASE_TOKEN (contents: write on lovlyDev/FormaCAD-beta) in GitHub Actions secrets' >&2; exit 1; fi
          BETA_REPO=lovlyDev/FormaCAD-beta
          if gh release view "$RELEASE_TAG" -R "$BETA_REPO" >/dev/null 2>&1; then
            echo 'Beta release already exists; refusing to overwrite it.'
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          sed -E "s#\]\(\.\./#](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/docs/#g" "docs/releases/$VERSION.md" > .release-notes.md
          gh release create "$RELEASE_TAG" -R "$BETA_REPO" --target main --draft --prerelease --title "Forma $VERSION" --notes-file .release-notes.md
          gh release upload "$RELEASE_TAG" -R "$BETA_REPO" .release-artifacts/*
          gh release edit "$RELEASE_TAG" -R "$BETA_REPO" --draft=false
      - name: Publish complete release
        if: ${{ !contains(github.ref_name, '-beta.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          # Release pages resolve relative links against /blob/, so point them at docs/ of this tag.
          sed -E "s#\]\(\.\./#](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/docs/#g" "docs/releases/$VERSION.md" > .release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Forma $VERSION" --notes-file .release-notes.md
          gh release upload "$RELEASE_TAG" .release-artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false --latest

  package-managers:
    # Stable releases only: submit the new version to the Microsoft winget catalog.
    # Skips with a warning when WINGET_TOKEN is missing, so a release never fails on the catalog.
    needs: publish
    if: ${{ !contains(github.ref_name, '-beta.') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Submit winget update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Output '::warning::Add WINGET_TOKEN (classic PAT, public_repo) to submit FormaCAD to winget'; exit 0 }
          $version = $env:RELEASE_TAG.TrimStart('v')
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/windows-x86_64-Forma_${version}_x64-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update lovlyDev.FormaCAD --version $version --urls $url --submit --token $env:WINGET_TOKEN
