name: Storage proposed folder workspace review
on:
  push:
    branches: [codex/storage-week]
    paths:
      - .github/workflows/storage-folder-write-review.yml
      - docs/integration/storage-folder-workspace.patch
      - docs/integration/storage-folder-workspace.paths
      - docs/integration/storage-folder-copy-recents.patch
      - docs/integration/storage-folder-copy-recents.paths
      - docs/integration/storage-step-transfer-ui.patch
      - docs/integration/storage-step-transfer-ui.paths
      - docs/integration/storage-folder-caption-browser.patch
      - apps/desktop/src-tauri/src/project_repository/folder_index.rs
      - apps/desktop/src-tauri/src/project_repository/sqlite_folder/api/sources.rs
      - apps/desktop/src-tauri/src/project_repository/sqlite_folder/api/sources/tests.rs
      - apps/desktop/src-tauri/src/project_repository/sqlite_folder/api/sources/step.rs
permissions:
  contents: read
jobs:
  isolated-proposal:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Apply the exact review patches inside this runner
        run: |
          set -euo pipefail
          echo '4437fdffbcf21cc35ac59fe64a7e0347bcfba0bd8696b1ff63e8046fd2b4796d  docs/integration/storage-folder-workspace.patch' | sha256sum --check
          echo '9158d5f12087fb4b2deb5521a564dae2aea263810a767544110375f48ae9a752  docs/integration/storage-folder-copy-recents.patch' | sha256sum --check
          echo '49f96915a5f98a4a1871a57509d1bef84a9f6843186e8c4db45dcd8f87ae3e0b  docs/integration/storage-step-transfer-ui.patch' | sha256sum --check
          echo 'd92a95867ed13332325e91e037a01a27d234d21f49104ba7c4a3b44ee7c76127  docs/integration/storage-folder-caption-browser.patch' | sha256sum --check
          git diff --quiet
          git diff --cached --quiet
          git apply --check --index --whitespace=error-all docs/integration/storage-folder-workspace.patch
          git apply --index --whitespace=error-all docs/integration/storage-folder-workspace.patch
          git diff --cached --check
          diff -u <(LC_ALL=C sort docs/integration/storage-folder-workspace.paths) <(git diff --cached --name-only | LC_ALL=C sort)
          diff -u <(LC_ALL=C sort docs/integration/storage-folder-copy-recents.paths) <(git apply --numstat docs/integration/storage-folder-copy-recents.patch | cut -f3 | LC_ALL=C sort)
          git apply --check --index --whitespace=error-all docs/integration/storage-folder-copy-recents.patch
          git apply --index --whitespace=error-all docs/integration/storage-folder-copy-recents.patch
          git diff --cached --check
          diff -u <(LC_ALL=C sort -u docs/integration/storage-folder-workspace.paths docs/integration/storage-folder-copy-recents.paths) <(git diff --cached --name-only | LC_ALL=C sort)
          diff -u <(LC_ALL=C sort docs/integration/storage-step-transfer-ui.paths) <(git apply --numstat docs/integration/storage-step-transfer-ui.patch | cut -f3 | LC_ALL=C sort)
          git apply --check --index --whitespace=error-all docs/integration/storage-step-transfer-ui.patch
          git apply --index --whitespace=error-all docs/integration/storage-step-transfer-ui.patch
          git diff --cached --check
          diff -u <(LC_ALL=C sort -u docs/integration/storage-folder-workspace.paths docs/integration/storage-folder-copy-recents.paths docs/integration/storage-step-transfer-ui.paths) <(git diff --cached --name-only | LC_ALL=C sort)
          diff -u <(printf '%s\n' apps/desktop/e2e/storage-folder-workspace.spec.ts apps/desktop/src/app/App.tsx) <(git apply --numstat docs/integration/storage-folder-caption-browser.patch | cut -f3 | LC_ALL=C sort)
          git apply --check --index --whitespace=error-all docs/integration/storage-folder-caption-browser.patch
          git apply --index --whitespace=error-all docs/integration/storage-folder-caption-browser.patch
          git diff --cached --check
          git diff --cached --stat
      - name: Prepare Rust and frontend build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          npm ci
          npm run build
          npm test
          npm run lint
          npm run check:i18n
          npm run check:docs
      - name: Test folder workspace in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w apps/desktop -- storage-folder-workspace.spec.ts
      - name: Check Rust handlers and run folder host tests
        run: |
          set -euo pipefail
          manifest=apps/desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo clippy --manifest-path "$manifest" --locked --all-targets --no-default-features -- -D warnings
          cargo test --manifest-path "$manifest" --locked --no-default-features --lib project_repository::window_sources:: -- --nocapture | tee window-tests.log
          grep -F 'test result: ok. 21 passed; 0 failed;' window-tests.log
          grep -F 'test project_repository::window_sources::write_ipc::tests::folder_write_accepts_the_key_issued_by_the_registry ... ok' window-tests.log
          cargo test --manifest-path "$manifest" --locked --no-default-features --lib project_repository::sqlite_folder::api::sources::tests::blank_creation_ -- --nocapture | tee creation-tests.log
          grep -F 'test result: ok. 2 passed; 0 failed;' creation-tests.log
          cargo test --manifest-path "$manifest" --locked --no-default-features --lib project_repository::sqlite_folder::api::sources::tests::indexed_opening_and_creation_futures_can_run_in_tauri_commands -- --exact --nocapture
          cargo test --manifest-path "$manifest" --locked --no-default-features --lib project_repository::folder_index::tests:: -- --nocapture | tee recents-tests.log
          grep -F 'test result: ok. 4 passed; 0 failed;' recents-tests.log
          cargo clippy --manifest-path "$manifest" --locked --all-targets --features native-worker-client -- -D warnings
