name: Storage native consumers
on:
  push:
    branches: [codex/storage-week]
    paths-ignore: [docs/integration/**]
  workflow_dispatch:
concurrency:
  group: storage-native-consumers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  measurement-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: |
            .local/occt-build-unix-x86_64-unknown-linux-gnu
            .local/occt-install-unix-x86_64-unknown-linux-gnu
          key: occt-V8_0_1-x86_64-unknown-linux-gnu-v1
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Existing native build and smoke route
        env:
          FORMA_NATIVE_TEST_ONLY: '1'
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p storage-native-evidence
          set -o pipefail
          bash scripts/build-native-unix.sh x86_64-unknown-linux-gnu app 2>&1 | tee storage-native-evidence/native-smoke.log
      - name: Execute host consumers and accepted M2 integration with the real CAD worker
        env:
          FORMA_OCCT_ROOT: ${{ github.workspace }}/.local/occt-install-unix-x86_64-unknown-linux-gnu
          FORMA_MEASUREMENT_TEST_WORKER: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/forma-cad-worker
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          git rev-parse HEAD > storage-native-evidence/source-sha.txt
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --features native-occt --test reference_measurements_host --test pair_measurements_host --test face_sections_host --test model_apply_transaction --test transform_worker --test snap_host --test snap_worker -- --nocapture 2>&1 | tee storage-native-evidence/host-consumers.log
      - name: Execute original-source folder measurements with the real worker
        env:
          FORMA_OCCT_ROOT: ${{ github.workspace }}/.local/occt-install-unix-x86_64-unknown-linux-gnu
          FORMA_MEASUREMENT_TEST_WORKER: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/forma-cad-worker
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          test -x "$FORMA_MEASUREMENT_TEST_WORKER"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --features native-occt --lib model_measurement::build::folder_tests:: -- --nocapture 2>&1 | tee storage-native-evidence/folder-measurements.log
          grep -F 'test result: ok. 2 passed; 0 failed;' storage-native-evidence/folder-measurements.log
      - name: Execute original-source folder previews with the real worker
        env:
          FORMA_OCCT_ROOT: ${{ github.workspace }}/.local/occt-install-unix-x86_64-unknown-linux-gnu
          FORMA_MEASUREMENT_TEST_WORKER: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/forma-cad-worker
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          test -x "$FORMA_MEASUREMENT_TEST_WORKER"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --features native-occt --lib model_preview::host::folder_tests:: -- --nocapture 2>&1 | tee storage-native-evidence/folder-previews.log
          grep -F 'test result: ok. 3 passed; 0 failed;' storage-native-evidence/folder-previews.log
      - name: Execute independent folder CAD roundtrip with the real worker
        env:
          FORMA_OCCT_ROOT: ${{ github.workspace }}/.local/occt-install-unix-x86_64-unknown-linux-gnu
          FORMA_FOLDER_TEST_WORKER: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/forma-cad-worker
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          test -x "$FORMA_FOLDER_TEST_WORKER"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --features native-occt --lib project_repository::sqlite_folder::session::apply::tests::real_worker_folder_roundtrip -- --ignored --exact --nocapture 2>&1 | tee storage-native-evidence/folder-cad-roundtrip.log
          grep -F 'test result: ok. 1 passed; 0 failed;' storage-native-evidence/folder-cad-roundtrip.log
      - name: Execute public folder host API with the real CAD worker
        env:
          FORMA_OCCT_ROOT: ${{ github.workspace }}/.local/occt-install-unix-x86_64-unknown-linux-gnu
          FORMA_FOLDER_TEST_WORKER: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/forma-cad-worker
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          test -x "$FORMA_FOLDER_TEST_WORKER"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --features native-occt --lib project_repository::sqlite_folder::api::worker_tests::real_worker_host_api_roundtrip -- --ignored --exact --nocapture 2>&1 | tee storage-native-evidence/folder-host-api-roundtrip.log
          grep -F 'test result: ok. 1 passed; 0 failed;' storage-native-evidence/folder-host-api-roundtrip.log
      - name: Execute retained folder permission commands with the real CAD worker
        env:
          FORMA_OCCT_ROOT: ${{ github.workspace }}/.local/occt-install-unix-x86_64-unknown-linux-gnu
          FORMA_FOLDER_TEST_WORKER: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/forma-cad-worker
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          test -x "$FORMA_FOLDER_TEST_WORKER"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --features native-occt --lib project_repository::window_sources::approval::tests::worker::real_command_decision_applies_original_cad_and_history -- --ignored --exact --nocapture 2>&1 | tee storage-native-evidence/folder-command-approval.log
          grep -F 'test result: ok. 1 passed; 0 failed;' storage-native-evidence/folder-command-approval.log
      - name: Execute selected STEP transfer with the real CAD worker
        env:
          FORMA_OCCT_ROOT: ${{ github.workspace }}/.local/occt-install-unix-x86_64-unknown-linux-gnu
          FORMA_FOLDER_TEST_WORKER: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/forma-cad-worker
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          test -x "$FORMA_FOLDER_TEST_WORKER"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --features native-occt --lib project_repository::sqlite_folder::step_transfer::tests::real_worker_step_transfer_roundtrip -- --ignored --exact --nocapture 2>&1 | tee storage-native-evidence/step-transfer-roundtrip.log
          grep -F 'test result: ok. 1 passed; 0 failed;' storage-native-evidence/step-transfer-roundtrip.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-native-consumers-${{ github.sha }}
          path: storage-native-evidence/
