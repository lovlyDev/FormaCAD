[package]
name = "forma-cad"
version = "1.5.0"
edition = "2021"
default-run = "forma-cad"

[lib]
name = "forma_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forma-cad-worker"
path = "src/bin/forma-cad-worker.rs"
required-features = ["native-occt"]

[features]
native-worker-client = ["dep:tempfile"]
native-occt = ["native-worker-client", "dep:cxx"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
cxx-build = "1"

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
directories = "6"
notify = "8"
toml = "0.8"
base64 = "0.22"
tauri-plugin-updater = { path = "../../../vendor/tauri-plugin-updater" }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
cxx = { version = "1", optional = true }
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = { version = "3", optional = true }
# FormaCAD account sign-in (system browser + loopback PKCE) and offline entitlement checks.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
rand = "0.8"
ed25519-dalek = "2"
# Plugin platform (plugin-api 0.1): sandboxed WASM components, manifest schema, formacad:// links.
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation", "anyhow"] }
jsonschema = { version = "0.60", default-features = false }
semver = "1"
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "cookies", "rustls-no-provider"] }
tempfile = "3"
tauri = { version = "=2.12.0", features = ["test"] }
wit-component = "0.262"
wit-parser = "0.262"
wat = "1"
